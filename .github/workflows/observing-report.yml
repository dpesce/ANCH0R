name: Process Observing Report

on:
  issues:
    types: [opened, edited, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh-report-pr:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'issues' ||
       contains(github.event.issue.body || '', '<!-- ANCH0R_OBSERVING_REPORT_V6 -->') ||
       contains(github.event.changes.body.from || '', '<!-- ANCH0R_OBSERVING_REPORT_V6 -->'))
    concurrency:
      group: observing-report-batch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh the observing-report review PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/process_pending_observing_reports.py
